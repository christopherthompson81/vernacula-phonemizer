name: CI

# ⚠ AUTOMATIC RUNS ARE OFF, DELIBERATELY. Solo repo, unpublished, and `npm run ci` (typecheck + test +
# check:package — the same three commands the jobs below run) is run locally before every merge, so the
# push/pull_request triggers only added a ~6-minute wait after the work was already verified.
#
# TO RUN IT ANYWAY: `gh workflow run ci.yml` (or the Actions tab) — the jobs are live, just not automatic.
# TO RESTORE BEFORE PUBLISHING: uncomment the two triggers below and delete this note. That is the whole
# change; nothing else here was touched.
#
# ⚠ WHAT LOCAL `npm run ci` DOES NOT COVER, and why this should go back on before the first publish:
# these jobs run a FRESH `npm ci` on a clean checkout at a pinned Node 22. A warm local node_modules hides
# lockfile drift, a dependency that no longer installs, and anything that depends on install order — the
# optional-dependency typecheck break fixed in #747 was only ever visible in that clean-install path.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # What `npm publish` would actually ship. Guards the fence in package.json `files`: without it npm falls
  # back to .gitignore and packs the whole repo, and a `files` allowlist silently overrides .gitignore.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Same script `npm run ci` runs locally — inline here it could only be exercised by pushing.
      - run: npm run check:package
