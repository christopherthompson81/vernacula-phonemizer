name: CI

# ⚠ PULL-REQUEST RUNS ARE OFF, DELIBERATELY. Solo repo, unpublished, and `npm run ci` (typecheck + test +
# check:goldens + check:package — the same commands the jobs below run) is run locally before every merge,
# so a `pull_request` trigger only added a ~6-minute wait after the work was already verified.
#
# ⚠ `push: [main]` IS CURRENTLY OFF AGAIN, AND NOT BECAUSE THE ARGUMENT BELOW WAS WRONG. Enabling it
# (#1283) made `check:goldens` run on a GitHub runner for the first time, and it reported 44 stale rows
# across the 20 ONNX-dependent languages while the same commit is 0-stale locally — `en` 1 row in 200,
# `ary` 10, `fa` 8. That shape is argmax flips in int8 inference across CPU microarchitectures, not
# staleness: a dead model would break most OOV words, not one. So the goldens are not bit-reproducible
# across machines for those languages, which the artifact never claimed and nobody had tested.
# A gate that is red on every push trains people to ignore red, so the trigger is off until the
# reproducibility question is settled. Tracked in its own issue. THE ARGUMENT FOR IT STANDS:
#
# ⚠ `push: [main]` IS THE RIGHT TRIGGER, AND NOT A RELAXATION OF THE ABOVE — it is the one case local
# pre-merge verification CANNOT cover. Two branches can each be green and still merge to a broken main when
# one changes an input and the other regenerates the artifact built from it: the conflict is SEMANTIC, so
# git merges it cleanly and both branches passed. That happened (#1283 case 2, and it cost a day of
# misdiagnosis), and it is why `csharp/PORTING.md` says freshness must be checked on the MERGE RESULT.
# Running after the merge adds no wait to anyone's loop.
#
# TO RUN IT ON A BRANCH ANYWAY: `gh workflow run ci.yml` (or the Actions tab).
# TO RESTORE FULL COVERAGE BEFORE PUBLISHING: uncomment `pull_request` below and delete this note.
#
# ⚠ WHAT LOCAL `npm run ci` DOES NOT COVER, and why the rest should go back on before the first publish:
# these jobs run a FRESH `npm ci` on a clean checkout at a pinned Node 22. A warm local node_modules hides
# lockfile drift, a dependency that no longer installs, and anything that depends on install order — the
# optional-dependency typecheck break fixed in #747 was only ever visible in that clean-install path.
# ⚠ AND THAT CLEAN INSTALL IS EXACTLY WHERE `check:goldens` EARNS ITS KEEP TWICE: `onnxruntime-node` is an
# OPTIONAL dependency, so `npm ci` does not fail when it does not install — the goldens are async-mode
# output, and the checker refuses to run rather than report the whole fleet stale.
on:
  workflow_dispatch:
  # ⚠ `push: [main]` WAS ON FOR ONE COMMIT AND IS OFF AGAIN — see the note above. It is the right trigger
  # for the merge race, and it will come back once `check:goldens` is stable across machines.
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # ⚠ Goldens are a GENERATED artifact committed to the repo, so they can go stale without any test
      # failing — including through a merge race no branch-scoped check can see. Pure TS, no corpus, no
      # dotnet. See csharp/PORTING.md and #1283.
      - run: npm run check:goldens

  # What `npm publish` would actually ship. Guards the fence in package.json `files`: without it npm falls
  # back to .gitignore and packs the whole repo, and a `files` allowlist silently overrides .gitignore.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Same script `npm run ci` runs locally — inline here it could only be exercised by pushing.
      - run: npm run check:package
