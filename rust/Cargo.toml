[workspace]
members = ["vernacula-phonemizer", "vernacula-json-derive", "tools/regex-diff", "tools/fn-diff", "tools/parity", "tools/onnx-diff"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
debug = 1

# regress 0.12.0 with a backtracking fix for a match attempt that starts inside a surrogate pair (see
# vendor/regress/VERNACULA_PATCH.md). Drop this once an upstream release carries the fix.
[patch.crates-io]
regress = { path = "vendor/regress" }
