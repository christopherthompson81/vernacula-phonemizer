[package]
name = "vernacula-phonemizer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Canonical-IPA phonemizer: a port of the vernacula-phonemizer TypeScript engine"
publish = false

[dependencies]
regress = { version = "0.12", default-features = false, features = ["std", "utf16"] }
indexmap = { version = "2", features = ["serde"] }
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
