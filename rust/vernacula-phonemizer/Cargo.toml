[package]
name = "vernacula-phonemizer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Canonical-IPA phonemizer: a port of the vernacula-phonemizer TypeScript engine"
publish = false

[dependencies]
regress = { version = "0.12", default-features = false, features = ["std", "utf16"] }
indexmap = { version = "2", features = ["serde"] }
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[features]
# One feature per language code the registry serves. `default` turns them all on; a consumer that
# wants a subset depends with `default-features = false` and names the codes. English (`en`) is not a
# feature: it is the foreign reader every host delegates Latin runs to, so it is always built.
default = [
    "en-GB",
    "en-IN",
    "ja",
    "it",
    "es",
